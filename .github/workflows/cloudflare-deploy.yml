name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/cloudflare-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: auth
        shell: bash
        run: |
          if [ -n "${CF_API_TOKEN:-}" ] && [ -n "${CF_ACCOUNT_ID:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured yet; deploy will be skipped."
          fi

      - name: Apply D1 migrations
        if: steps.auth.outputs.ready == 'true'
        run: npx --yes wrangler@latest d1 migrations apply DB --remote

      - name: Sync setup key
        if: steps.auth.outputs.ready == 'true'
        env:
          CAFE_SETUP_KEY: ${{ secrets.CAFE_SETUP_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CAFE_SETUP_KEY:-}" ]; then
            printf '%s' "$CAFE_SETUP_KEY" | npx --yes wrangler@latest secret put SETUP_KEY
          else
            echo "CAFE_SETUP_KEY is not configured yet; initial admin bootstrap will remain locked."
          fi

      - name: Deploy Worker
        if: steps.auth.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Cloudflare credentials required
        if: steps.auth.outputs.ready != 'true'
        run: |
          echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
