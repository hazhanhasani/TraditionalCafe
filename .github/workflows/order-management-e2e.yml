name: Order Management E2E

on:
  workflow_run:
    workflows:
      - "Deploy Cloudflare Worker"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traditionalcafe-d1-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://traditionalcafe.hazhanhasani4268-0f9.workers.dev
      CAFE_SETUP_KEY: ${{ secrets.CAFE_SETUP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test complete order workflow
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.API_BASE;
          const setupKey = process.env.CAFE_SETUP_KEY;
          const suffix = process.env.GITHUB_RUN_ID + process.env.GITHUB_RUN_ATTEMPT;
          const username = "e2e" + suffix;
          const password = "CafeE2E-" + suffix + "!";
          const tableA = "E2E-A-" + suffix;
          const tableB = "E2E-B-" + suffix;
          const serviceName = "E2E-Service-" + suffix;
          const customerName = "E2E-Customer-" + suffix;

          async function request(path, method="GET", body=null, token=null, setup=false) {
            const headers = { "accept": "application/json", "content-type": "application/json" };
            if (token) headers.authorization = "Bearer " + token;
            if (setup) headers["x-setup-key"] = setupKey;
            const response = await fetch(base + path, {
              method,
              headers,
              body: body === null ? undefined : JSON.stringify(body)
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok) {
              throw new Error(method + " " + path + " -> " + response.status + " " + text);
            }
            return data;
          }

          function assert(condition, message) {
            if (!condition) throw new Error("ASSERT: " + message);
          }

          async function expectError(path, method, body, token, expectedStatus, expectedCode) {
            const headers = { "accept": "application/json", "content-type": "application/json" };
            if (token) headers.authorization = "Bearer " + token;
            const response = await fetch(base + path, {
              method,
              headers,
              body: body === null ? undefined : JSON.stringify(body)
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch {}
            assert(response.status === expectedStatus, "expected HTTP " + expectedStatus + " but got " + response.status);
            if (expectedCode) assert(data.error === expectedCode, "expected error " + expectedCode + " but got " + data.error);
            return data;
          }

          const created = await request("/api/setup/user", "POST", {
            username,
            name: "E2E Admin",
            password,
            role: "admin"
          }, null, true);
          const token = created.token;
          assert(token, "admin token missing");

          const shiftOpened = await request("/api/shifts/open", "POST", {
            opening_cash: 100000
          }, token);
          const shiftId = shiftOpened.shift.id;
          assert(shiftOpened.shift.opening_cash === 100000, "opening cash mismatch");

          const a = await request("/api/tables", "POST", { name: tableA }, token);
          const b = await request("/api/tables", "POST", { name: tableB }, token);
          const service = await request("/api/catalog", "POST", {
            type: "service",
            name: serviceName,
            price: 10000,
            cost: 2500
          }, token);

          const openA = await request("/api/tables/" + a.id + "/open", "POST", {}, token);
          const openB = await request("/api/tables/" + b.id + "/open", "POST", {}, token);

          const first = await request("/api/orders/" + openA.order_id + "/items", "POST", {
            catalog_type: "service",
            catalog_id: service.id,
            qty: 1
          }, token);

          const temp = await request("/api/orders/" + openA.order_id + "/items", "POST", {
            catalog_type: "service",
            catalog_id: service.id,
            qty: 1
          }, token);

          await request("/api/orders/" + openA.order_id + "/items/" + first.id, "PATCH", {
            qty: 3
          }, token);

          await request("/api/orders/" + openA.order_id + "/items/" + temp.id, "DELETE", null, token);

          await request("/api/orders/" + openB.order_id + "/items", "POST", {
            catalog_type: "service",
            catalog_id: service.id,
            qty: 2
          }, token);

          const merged = await request("/api/orders/" + openA.order_id + "/merge", "POST", {
            source_order_id: openB.order_id
          }, token);
          assert(merged.totals.total === 50000, "merge total should be 50000");

          const transferred = await request("/api/orders/" + openA.order_id + "/transfer", "POST", {
            table_id: b.id
          }, token);
          assert(Number(transferred.table_id) === Number(b.id), "transfer failed");

          const detail = await request("/api/orders/" + openA.order_id, "GET", null, token);
          assert(detail.order.total === 50000, "order total mismatch after edits/merge");

          const settled = await request("/api/orders/" + openA.order_id + "/settle", "POST", {
            discount: 0,
            payments: [{ method: "cash", amount: 50000 }]
          }, token);
          assert(settled.ok === true, "settlement failed");

          const shiftAfterSale = await request("/api/shifts/current", "GET", null, token);
          assert(shiftAfterSale.shift.cash_sales === 50000, "shift cash sales mismatch");
          assert(shiftAfterSale.shift.expected_cash_live === 150000, "shift expected cash after sale mismatch");

          const reversed = await request("/api/orders/" + openA.order_id + "/reverse-settlement", "POST", {
            reason: "E2E reversal test"
          }, token);
          assert(reversed.status === "open", "reverse settlement failed");

          const cancelled = await request("/api/orders/" + openA.order_id + "/cancel", "POST", {
            reason: "E2E cancel test"
          }, token);
          assert(cancelled.status === "cancelled", "cancel failed");

          const deletedTarget = await request("/api/orders/" + openA.order_id, "DELETE", null, token);
          assert(Number(deletedTarget.deleted_order_id) === Number(openA.order_id), "hard delete target failed");
          assert(deletedTarget.safety_backup_id, "pre-delete backup missing for target order");

          const deletedSource = await request("/api/orders/" + openB.order_id, "DELETE", null, token);
          assert(Number(deletedSource.deleted_order_id) === Number(openB.order_id), "hard delete source failed");
          assert(deletedSource.safety_backup_id, "pre-delete backup missing for source order");

          const customer = await request("/api/customers", "POST", {
            name: customerName,
            phone: "09120000000",
            notes: "E2E credit customer",
            credit_limit: 30000,
            due_days: 1
          }, token);
          assert(Number(customer.id) > 0, "customer creation failed");

          const creditOrder = await request("/api/tables/" + a.id + "/open", "POST", {}, token);
          await request("/api/orders/" + creditOrder.order_id + "/items", "POST", {
            catalog_type: "service",
            catalog_id: service.id,
            qty: 2
          }, token);
          await request("/api/orders/" + creditOrder.order_id + "/settle", "POST", {
            discount: 0,
            payments: [{ method: "credit", amount: 20000, customer_id: customer.id }]
          }, token);

          const ledgerAfterCredit = await request(
            "/api/customers/" + customer.id + "/ledger?full=1",
            "GET",
            null,
            token
          );
          assert(ledgerAfterCredit.customer.balance === 20000, "credit balance mismatch");
          assert(ledgerAfterCredit.customer.remaining_credit === 10000, "remaining credit mismatch");
          assert((ledgerAfterCredit.entries || []).some(x => x.entry_type === "debt" && x.due_at), "credit due date missing");

          await request("/api/customers/" + customer.id + "/payment", "POST", {
            amount: 5000,
            payment_method: "card",
            note: "E2E partial payment"
          }, token);

          const ledgerAfterPayment = await request(
            "/api/customers/" + customer.id + "/ledger?full=1",
            "GET",
            null,
            token
          );
          assert(ledgerAfterPayment.customer.balance === 15000, "partial payment balance mismatch");

          await request("/api/customers/" + customer.id + "/adjustment", "POST", {
            direction: "debt",
            amount: 2000,
            note: "E2E manual debt correction"
          }, token);

          await request("/api/customers/" + customer.id + "/adjustment", "POST", {
            direction: "credit",
            amount: 1000,
            note: "E2E manual credit correction"
          }, token);

          const ledgerAfterAdjustment = await request(
            "/api/customers/" + customer.id + "/ledger?full=1",
            "GET",
            null,
            token
          );
          assert(ledgerAfterAdjustment.customer.balance === 16000, "adjustment balance mismatch");
          assert(ledgerAfterAdjustment.statement.transaction_count >= 4, "statement summary missing");
          assert(
            (ledgerAfterAdjustment.entries || []).some(x =>
              x.entry_type === "adjustment" && x.running_balance !== null
            ),
            "running balance missing"
          );

          const blockedOrder = await request("/api/tables/" + b.id + "/open", "POST", {}, token);
          await request("/api/orders/" + blockedOrder.order_id + "/items", "POST", {
            catalog_type: "service",
            catalog_id: service.id,
            qty: 2
          }, token);

          await expectError(
            "/api/orders/" + blockedOrder.order_id + "/settle",
            "POST",
            {
              discount: 0,
              payments: [{ method: "credit", amount: 20000, customer_id: customer.id }]
            },
            token,
            409,
            "credit_limit_exceeded"
          );

          const deletedBlocked = await request("/api/orders/" + blockedOrder.order_id, "DELETE", null, token);
          assert(deletedBlocked.safety_backup_id, "pre-delete backup missing for blocked order");

          const expenseDescription = "E2E expense " + suffix;
          await request("/api/expenses", "POST", {
            category: "E2E",
            amount: 5000,
            description: expenseDescription,
            payment_method: "cash"
          }, token);

          const shiftBeforeClose = await request("/api/shifts/current", "GET", null, token);
          assert(shiftBeforeClose.shift.cash_sales === 0, "reversed sale must not remain in shift");
          assert(shiftBeforeClose.shift.cash_expenses === 5000, "shift cash expense mismatch");
          assert(shiftBeforeClose.shift.expected_cash_live === 95000, "expected cash before close mismatch");

          const closedShift = await request("/api/shifts/" + shiftId + "/close", "POST", {
            counted_cash: 94000,
            note: "E2E shift close"
          }, token);
          assert(closedShift.shift.status === "closed", "shift close failed");
          assert(closedShift.shift.expected_cash === 95000, "closed expected cash mismatch");
          assert(closedShift.shift.cash_difference === -1000, "cash difference mismatch");

          const iranTime = await request("/api/time", "GET");
          const dailyReport = await request(
            "/api/reports/daily?date=" + iranTime.iran_date,
            "GET",
            null,
            token
          );
          assert(dailyReport.summary && typeof dailyReport.summary.sales === "number", "daily report summary missing");
          assert(Array.isArray(dailyReport.payment_methods), "daily report payments missing");
          assert(Array.isArray(dailyReport.category_sales), "daily report category sales missing");
          assert(Array.isArray(dailyReport.top_items), "daily report top items missing");
          assert(Array.isArray(dailyReport.staff_sales), "daily report staff sales missing");
          assert(Array.isArray(dailyReport.hourly_sales), "daily report hourly sales missing");

          const manualBackup = await request("/api/backups", "POST", {
            reason: "e2e_backup_" + suffix
          }, token);
          assert(manualBackup.backup && manualBackup.backup.id, "manual backup id missing");
          assert(manualBackup.backup.status === "ready", "manual backup not ready");
          assert(Number(manualBackup.backup.table_count) > 0, "manual backup table count missing");

          const backupList = await request("/api/backups?limit=20", "GET", null, token);
          assert(Array.isArray(backupList.backups), "backup list missing");
          assert(
            backupList.backups.some(x => x.id === manualBackup.backup.id && x.status === "ready"),
            "manual backup missing from list"
          );

          const exportedBackup = await request(
            "/api/backups/" + manualBackup.backup.id + "/export?format=json",
            "GET",
            null,
            token
          );
          assert(exportedBackup.format === "traditionalcafe-backup-v1", "backup JSON export format mismatch");
          assert(exportedBackup.tables && typeof exportedBackup.tables === "object", "backup JSON tables missing");

          await expectError(
            "/api/backups/" + manualBackup.backup.id + "/restore",
            "POST",
            {},
            token,
            409,
            "restore_confirmation_required"
          );

          const auditCenter = await request(
            "/api/audit?user_id=" + created.user.id + "&limit=100",
            "GET",
            null,
            token
          );
          assert(auditCenter.summary && auditCenter.summary.matched_count > 0, "audit summary missing");
          assert(Array.isArray(auditCenter.logs) && auditCenter.logs.length > 0, "audit logs missing");
          assert(Array.isArray(auditCenter.users), "audit users filter missing");
          assert(Array.isArray(auditCenter.actions), "audit actions filter missing");
          assert(
            auditCenter.logs.some(x => x.action === "customer_ledger_adjustment" && x.severity === "critical"),
            "critical audit classification missing"
          );

          const financeAudit = await request(
            "/api/audit?user_id=" + created.user.id + "&category=finance&limit=100",
            "GET",
            null,
            token
          );
          assert(
            financeAudit.logs.every(x => x.category === "finance"),
            "audit category filter mismatch"
          );

          console.log("ORDER_MANAGEMENT_E2E_OK", {
            itemEdit: true,
            itemDelete: true,
            merge: true,
            transfer: true,
            settle: true,
            reverseSettlement: true,
            cancel: true,
            hardDelete: true,
            shiftOpen: true,
            shiftAccounting: true,
            shiftClose: true,
            creditLimit: true,
            partialDebtPayment: true,
            customerLedger: true,
            customerAdjustments: true,
            runningBalance: true,
            dailyReport: true,
            auditCenter: true,
            backupRecovery: true,
            preDeleteSnapshots: true
          });

          await request("/api/backups/" + manualBackup.backup.id, "DELETE", null, token);
          await request("/api/backups/" + deletedTarget.safety_backup_id, "DELETE", null, token);
          await request("/api/backups/" + deletedSource.safety_backup_id, "DELETE", null, token);
          await request("/api/backups/" + deletedBlocked.safety_backup_id, "DELETE", null, token);
          NODE

      - name: Cleanup test records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          USERNAME="e2e${SUFFIX}"
          TABLE_A="E2E-A-${SUFFIX}"
          TABLE_B="E2E-B-${SUFFIX}"
          SERVICE="E2E-Service-${SUFFIX}"
          CUSTOMER="E2E-Customer-${SUFFIX}"
          EXPENSE_DESC="E2E expense ${SUFFIX}"

          SQL="
          DELETE FROM customer_ledger WHERE customer_id IN (
            SELECT id FROM customers WHERE name='$CUSTOMER'
          );
          DELETE FROM customer_ledger WHERE order_id IN (
            SELECT o.id FROM orders o
            JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM payments WHERE order_id IN (
            SELECT o.id FROM orders o
            JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM order_items WHERE order_id IN (
            SELECT o.id FROM orders o
            JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM orders WHERE table_id IN (
            SELECT id FROM cafe_tables WHERE name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM cafe_tables WHERE name IN ('$TABLE_A','$TABLE_B');
          DELETE FROM expenses WHERE description='$EXPENSE_DESC';
          DELETE FROM service_catalog WHERE name='$SERVICE';
          DELETE FROM customers WHERE name='$CUSTOMER';
          DELETE FROM backup_snapshots WHERE created_by IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM cash_shifts WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM audit_logs WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM users WHERE username='$USERNAME';
          "

          npx --yes wrangler@latest d1 execute DB --remote --command "$SQL"
