name: Setup TraditionalCafe D1

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - ".github/workflows/setup-d1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Ensure D1 database exists and bind it
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@latest d1 list --json > "$RUNNER_TEMP/d1-list.json"

          DB_ID="$(node -e "
            const fs=require('fs');
            const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/d1-list.json','utf8'));
            const row=data.find(x => x.name === 'traditionalcafe-db');
            process.stdout.write(row ? row.uuid : '');
          ")"

          if [ -z "$DB_ID" ]; then
            echo "Creating traditionalcafe-db..."
            npx wrangler@latest d1 create traditionalcafe-db --binding DB --update-config
            npx wrangler@latest d1 list --json > "$RUNNER_TEMP/d1-list.json"
            DB_ID="$(node -e "
              const fs=require('fs');
              const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/d1-list.json','utf8'));
              const row=data.find(x => x.name === 'traditionalcafe-db');
              process.stdout.write(row ? row.uuid : '');
            ")"
          fi

          test -n "$DB_ID"

          if ! grep -q 'binding = "DB"' wrangler.toml; then
            cat >> wrangler.toml <<EOF

          [[d1_databases]]
          binding = "DB"
          database_name = "traditionalcafe-db"
          database_id = "$DB_ID"
          EOF
          else
            node -e "
              const fs=require('fs');
              let s=fs.readFileSync('wrangler.toml','utf8');
              if (!/database_id\s*=/.test(s)) {
                s=s.replace(/database_name\s*=\s*\"traditionalcafe-db\"/, m => m + '\\ndatabase_id = \"' + process.env.DB_ID + '\"');
              }
              fs.writeFileSync('wrangler.toml',s);
            "
          fi

          echo "D1 database: $DB_ID"

      - name: Apply D1 migrations
        run: npx wrangler@latest d1 migrations apply traditionalcafe-db --remote

      - name: Commit binding configuration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- wrangler.toml; then
            echo "wrangler.toml already contains the D1 binding."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "Configure TraditionalCafe D1 binding"
          git push
