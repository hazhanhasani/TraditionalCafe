name: Offline Sync E2E

on:
  workflow_run:
    workflows:
      - "Deploy Cloudflare Worker"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traditionalcafe-offline-sync-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: http://127.0.0.1:8787
      CAFE_SETUP_KEY: traditionalcafe-local-e2e-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start isolated local Worker
        shell: bash
        run: bash .github/scripts/start-local-e2e.sh

      - name: Test offline sync and idempotency
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.API_BASE;
          const setupKey = process.env.CAFE_SETUP_KEY;
          const suffix = process.env.GITHUB_RUN_ID + process.env.GITHUB_RUN_ATTEMPT;
          const username = "offline" + suffix;
          const password = "OfflineE2E-" + suffix + "!";
          const displayName = "Offline E2E " + suffix;
          const tableName = "OFFLINE-" + suffix;
          const serviceName = "Offline-Service-" + suffix;
          const operationId = "draft-" + suffix + "-primary";

          function assert(condition, message) {
            if (!condition) throw new Error("ASSERT: " + message);
          }

          async function call(path, method="GET", body=null, token=null, extraHeaders={}) {
            const headers = {
              accept: "application/json",
              "content-type": "application/json",
              ...extraHeaders
            };
            if (token) headers.authorization = "Bearer " + token;

            const response = await fetch(base + path, {
              method,
              headers,
              body: body === null ? undefined : JSON.stringify(body)
            });

            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch {}

            return { response, data, text };
          }

          async function ok(path, method="GET", body=null, token=null, headers={}) {
            const result = await call(path, method, body, token, headers);
            if (!result.response.ok) {
              throw new Error(method + " " + path + " -> " + result.response.status + " " + result.text);
            }
            return result;
          }

          const setup = await call(
            "/api/setup/user",
            "POST",
            {
              username,
              name: displayName,
              password,
              role: "admin"
            },
            null,
            { "x-setup-key": setupKey }
          );
          assert(setup.response.status === 201, "setup user failed");
          const token = setup.data.token;
          assert(token, "token missing");

          const health = await ok("/api/health");
          assert(health.data.offline_sync === "ready", "offline schema not ready");

          const shift = await ok(
            "/api/shifts/open",
            "POST",
            { opening_cash: 100000 },
            token
          );
          assert(shift.data.shift && shift.data.shift.status === "open", "shift missing");

          const table = await ok(
            "/api/tables",
            "POST",
            { name: tableName },
            token
          );

          const service = await ok(
            "/api/catalog",
            "POST",
            {
              type: "service",
              name: serviceName,
              price: 10000,
              cost: 2500
            },
            token
          );

          const payload = {
            operation_id: operationId,
            table_id: table.data.id,
            offline_created_at: new Date().toISOString(),
            items: [
              {
                catalog_type: "service",
                catalog_id: service.data.id,
                qty: 2
              }
            ]
          };

          const first = await ok(
            "/api/offline/orders/sync",
            "POST",
            payload,
            token,
            { "x-offline-operation-id": operationId }
          );
          assert(first.data.synced === true, "first offline sync failed");
          assert(first.data.totals.total === 20000, "offline order total mismatch");

          const second = await ok(
            "/api/offline/orders/sync",
            "POST",
            payload,
            token,
            { "x-offline-operation-id": operationId }
          );
          assert(
            Number(second.data.order_id) === Number(first.data.order_id),
            "idempotent replay returned another order"
          );
          assert(
            second.response.headers.get("x-offline-replayed") === "1",
            "idempotent replay header missing"
          );

          const detail = await ok(
            "/api/orders/" + first.data.order_id,
            "GET",
            null,
            token
          );
          assert(detail.data.order.total === 20000, "synced detail total mismatch");
          assert(detail.data.items.length === 1, "offline order duplicated items");
          assert(detail.data.items[0].qty === 2, "offline item quantity mismatch");

          const conflictOperation = "draft-" + suffix + "-conflict";
          const conflict = await call(
            "/api/offline/orders/sync",
            "POST",
            {
              operation_id: conflictOperation,
              table_id: table.data.id,
              items: [
                {
                  catalog_type: "service",
                  catalog_id: service.data.id,
                  qty: 1
                }
              ]
            },
            token,
            { "x-offline-operation-id": conflictOperation }
          );
          assert(conflict.response.status === 409, "table conflict should be HTTP 409");
          assert(
            conflict.data.error === "offline_table_conflict",
            "wrong offline conflict error"
          );

          console.log("OFFLINE_SYNC_E2E_OK", {
            cacheContract: true,
            orderSync: true,
            idempotency: true,
            duplicateProtection: true,
            tableConflict: true
          });
          NODE

      - name: Stop isolated local Worker
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/traditionalcafe-wrangler.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/traditionalcafe-wrangler.pid")" 2>/dev/null || true
          fi
          if [ "${{ job.status }}" != "success" ]; then
            cat "$RUNNER_TEMP/traditionalcafe-wrangler.log" || true
          fi
