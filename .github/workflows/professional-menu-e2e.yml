name: Professional Menu E2E

on:
  workflow_run:
    workflows:
      - "Deploy Cloudflare Worker"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traditionalcafe-d1-e2e
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: https://traditionalcafe.hazhanhasani4268-0f9.workers.dev
      CAFE_SETUP_KEY: ${{ secrets.CAFE_SETUP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test categorized professional menu
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.API_BASE;
          const setupKey = process.env.CAFE_SETUP_KEY;
          const suffix = process.env.GITHUB_RUN_ID + process.env.GITHUB_RUN_ATTEMPT;
          const username = "menu" + suffix;
          const password = "Menu-" + suffix + "!";
          const drinkCategory = "E2E-Hot-" + suffix;
          const foodCategory = "E2E-Food-" + suffix;
          const drinkName = "E2E-Tea-" + suffix;
          const foodName = "E2E-Snack-" + suffix;
          const tableName = "E2E-MENU-" + suffix;

          async function req(path, method="GET", body=null, token=null, setup=false) {
            const headers = {"content-type":"application/json","accept":"application/json"};
            if (token) headers.authorization = "Bearer " + token;
            if (setup) headers["x-setup-key"] = setupKey;
            const response = await fetch(base + path, {
              method, headers,
              body: body === null ? undefined : JSON.stringify(body)
            });
            const text = await response.text();
            let data = {};
            try { data = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok) {
              throw new Error(method + " " + path + " -> " + response.status + " " + text);
            }
            return data;
          }

          function assert(v,m){ if(!v) throw new Error("ASSERT: " + m); }

          const setup = await req("/api/setup/user","POST",{
            username,name:"Menu E2E",password,role:"admin"
          },null,true);
          const token = setup.token;
          assert(token,"admin token");

          await req("/api/shifts/open","POST",{opening_cash:0},token);

          const hot = await req("/api/catalog-categories","POST",{
            section:"drink",name:drinkCategory,sort_order:1,active:true
          },token);
          const foodCat = await req("/api/catalog-categories","POST",{
            section:"food",name:foodCategory,sort_order:1,active:true
          },token);

          const drink = await req("/api/catalog","POST",{
            type:"drink",name:drinkName,price:15000,cost:4000,
            description:"E2E hot drink",category_id:hot.id,sort_order:1,active:true
          },token);
          const food = await req("/api/catalog","POST",{
            type:"food",name:foodName,price:25000,cost:9000,
            description:"E2E snack",category_id:foodCat.id,sort_order:1,active:true
          },token);

          const drinks = await req("/api/catalog?type=drink","GET",null,token);
          const drinkRow = (drinks.items || []).find(x => Number(x.id) === Number(drink.id));
          assert(drinkRow && drinkRow.category_name === drinkCategory,"drink category");
          assert(drinkRow.item_kind === "drink","drink kind");

          const foods = await req("/api/catalog?type=food","GET",null,token);
          const foodRow = (foods.items || []).find(x => Number(x.id) === Number(food.id));
          assert(foodRow && foodRow.category_name === foodCategory,"food category");

          assert(!(drinks.items || []).some(x => Number(x.id) === Number(food.id)),"section isolation");

          const table = await req("/api/tables","POST",{name:tableName},token);
          const opened = await req("/api/tables/" + table.id + "/open","POST",{},token);

          await req("/api/orders/" + opened.order_id + "/items","POST",{
            catalog_type:"drink",catalog_id:drink.id,qty:2
          },token);
          await req("/api/orders/" + opened.order_id + "/items","POST",{
            catalog_type:"food",catalog_id:food.id,qty:1
          },token);

          const detail = await req("/api/orders/" + opened.order_id,"GET",null,token);
          assert(detail.order.total === 55000,"categorized menu total");
          assert((detail.items || []).some(x => x.catalog_kind === "drink"),"drink kind on order");
          assert((detail.items || []).some(x => x.catalog_kind === "food"),"food kind on order");

          await req("/api/orders/" + opened.order_id + "/settle","POST",{
            discount:0,payments:[{method:"cash",amount:55000}]
          },token);

          console.log("PROFESSIONAL_MENU_E2E_OK",{
            categories:true,drink:true,food:true,sectionIsolation:true,orderKinds:true
          });
          NODE

      - name: Cleanup menu test records
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="${GITHUB_RUN_ID}${GITHUB_RUN_ATTEMPT}"
          USERNAME="menu${SUFFIX}"
          TABLE="E2E-MENU-${SUFFIX}"
          DRINK_CATEGORY="E2E-Hot-${SUFFIX}"
          FOOD_CATEGORY="E2E-Food-${SUFFIX}"
          DRINK="E2E-Tea-${SUFFIX}"
          FOOD="E2E-Snack-${SUFFIX}"

          npx --yes wrangler@latest d1 execute DB --remote --command "
          DELETE FROM customer_ledger WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id WHERE t.name='$TABLE'
          );
          DELETE FROM payments WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id WHERE t.name='$TABLE'
          );
          DELETE FROM inventory_movements WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id WHERE t.name='$TABLE'
          );
          DELETE FROM order_items WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id WHERE t.name='$TABLE'
          );
          DELETE FROM orders WHERE table_id IN (SELECT id FROM cafe_tables WHERE name='$TABLE');
          DELETE FROM cafe_tables WHERE name='$TABLE';
          DELETE FROM catalog_inventory_links WHERE catalog_type='service' AND catalog_id IN (
            SELECT id FROM service_catalog WHERE name IN ('$DRINK','$FOOD')
          );
          DELETE FROM service_catalog WHERE name IN ('$DRINK','$FOOD');
          DELETE FROM catalog_categories WHERE name IN ('$DRINK_CATEGORY','$FOOD_CATEGORY');
          DELETE FROM cash_shifts WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM audit_logs WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM users WHERE username='$USERNAME';
          "
