name: D1 Failure Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d1-failure-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect backup failures
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BACKUP SNAPSHOTS ==="
          npx --yes wrangler@latest d1 execute traditionalcafe-db --remote --json --command "SELECT id,kind,reason,status,created_by,created_at,completed_at,table_count,row_count,size_bytes,metadata FROM backup_snapshots ORDER BY created_at DESC LIMIT 30;"
          echo "=== E2E USERS ==="
          npx --yes wrangler@latest d1 execute traditionalcafe-db --remote --json --command "SELECT id,username,name,role,active,created_at FROM users WHERE username LIKE 'e2e%' OR username LIKE 'menu%' ORDER BY id DESC LIMIT 40;"
          echo "=== TABLES ==="
          npx --yes wrangler@latest d1 execute traditionalcafe-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"

      - name: Cleanup stale E2E residue
        shell: bash
        run: |
          set -euo pipefail
          SUFFIX="355423384391"
          USERNAME="e2e${SUFFIX}"
          TABLE_A="E2E-A-${SUFFIX}"
          TABLE_B="E2E-B-${SUFFIX}"
          SERVICE="E2E-Service-${SUFFIX}"
          CUSTOMER="E2E-Customer-${SUFFIX}"
          EXPENSE_DESC="E2E expense ${SUFFIX}"

          npx --yes wrangler@latest d1 execute traditionalcafe-db --remote --command "
          DELETE FROM backup_snapshots WHERE status='failed';
          DELETE FROM customer_ledger WHERE customer_id IN (SELECT id FROM customers WHERE name='$CUSTOMER');
          DELETE FROM customer_ledger WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM payments WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM inventory_movements WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM order_items WHERE order_id IN (
            SELECT o.id FROM orders o JOIN cafe_tables t ON t.id=o.table_id
            WHERE t.name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM orders WHERE table_id IN (
            SELECT id FROM cafe_tables WHERE name IN ('$TABLE_A','$TABLE_B')
          );
          DELETE FROM cafe_tables WHERE name IN ('$TABLE_A','$TABLE_B');
          DELETE FROM expenses WHERE description='$EXPENSE_DESC';
          DELETE FROM service_catalog WHERE name='$SERVICE';
          DELETE FROM customers WHERE name='$CUSTOMER';
          DELETE FROM cash_shifts WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM audit_logs WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM sessions WHERE user_id IN (SELECT id FROM users WHERE username='$USERNAME');
          DELETE FROM users WHERE username='$USERNAME';
          "
