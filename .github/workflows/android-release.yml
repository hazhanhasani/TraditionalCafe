name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name"
        required: true
        default: "0.1.5"
      version_code:
        description: "Version code (must always increase)"
        required: true
        default: "100005"
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-release.yml"

permissions:
  contents: write

concurrency:
  group: android-release-main-v2
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate launch activity source
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/hazhanhasani/traditionalcafe/MainActivity.java
          test -f app/src/main/java/com/hazhanhasani/traditionalcafe/AuthActivity.java
          grep -q 'public class MainActivity' app/src/main/java/com/hazhanhasani/traditionalcafe/MainActivity.java
          grep -q 'public class AuthActivity' app/src/main/java/com/hazhanhasani/traditionalcafe/AuthActivity.java

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$STORE_PASS" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          test -n "$KEY_PASS" || (echo "ANDROID_KEY_PASSWORD is missing" && exit 1)

      - name: Restore permanent release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/traditionalcafe-release.jks"
          chmod 600 "$RUNNER_TEMP/traditionalcafe-release.jks"

      - name: Verify permanent certificate
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          EXPECTED="4B:B8:12:E9:1C:69:57:E5:5F:34:32:06:A2:DF:C8:F7:F2:8E:CB:94:90:EC:F4:86:FF:4E:F9:D2:75:39:84:E2"
          ACTUAL="$(keytool -list -v             -keystore "$RUNNER_TEMP/traditionalcafe-release.jks"             -storepass "$STORE_PASS"             -alias "$KEY_ALIAS"             | sed -n 's/^[[:space:]]*SHA256: //p' | head -n1)"
          echo "Expected certificate: $EXPECTED"
          echo "Actual certificate:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED" || (echo "Wrong signing key. Build blocked." && exit 1)

      - name: Build signed release APK
        env:
          TC_KEYSTORE_PATH: ${{ runner.temp }}/traditionalcafe-release.jks
          TC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME_INPUT: ${{ github.event.inputs.version_name }}
          APP_VERSION_CODE_INPUT: ${{ github.event.inputs.version_code }}
        run: |
          set -euo pipefail
          if [ -n "${APP_VERSION_NAME_INPUT:-}" ]; then
            export APP_VERSION_NAME="$APP_VERSION_NAME_INPUT"
          else
            export APP_VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          fi
          if [ -n "${APP_VERSION_CODE_INPUT:-}" ]; then
            export APP_VERSION_CODE="$APP_VERSION_CODE_INPUT"
          else
            export APP_VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          fi
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$APP_VERSION_NAME" >> "$GITHUB_ENV"
          echo "Building versionName=$APP_VERSION_NAME versionCode=$APP_VERSION_CODE"
          gradle --no-daemon clean :app:assembleRelease

      - name: Verify launcher class is inside APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          DEXDUMP="$ANDROID_HOME/build-tools/35.0.0/dexdump"
          unzip -p "$APK" classes.dex > "$RUNNER_TEMP/classes.dex"
          "$DEXDUMP" "$RUNNER_TEMP/classes.dex" | grep -F 'Class descriptor  : '\''Lcom/hazhanhasani/traditionalcafe/MainActivity;'\'''
          "$DEXDUMP" "$RUNNER_TEMP/classes.dex" | grep -F 'Class descriptor  : '\''Lcom/hazhanhasani/traditionalcafe/AuthActivity;'\'''

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TraditionalCafe-release.apk
          sha256sum dist/TraditionalCafe-release.apk > dist/TraditionalCafe-release.apk.sha256

      - name: Generate update manifest
        run: |
          set -euo pipefail
          APK_SHA="$(cut -d' ' -f1 dist/TraditionalCafe-release.apk.sha256)"
          cat > dist/update.json <<EOF
          {
            "version": "$APP_VERSION_NAME",
            "versionCode": $APP_VERSION_CODE,
            "apk_url": "https://github.com/hazhanhasani/TraditionalCafe/releases/latest/download/TraditionalCafe-release.apk",
            "sha256": "$APK_SHA"
          }
          EOF

      - name: Publish update release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/TraditionalCafe-release.apk \
              dist/TraditionalCafe-release.apk.sha256 \
              dist/update.json \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/TraditionalCafe-release.apk \
              dist/TraditionalCafe-release.apk.sha256 \
              dist/update.json \
              --target "$GITHUB_SHA" \
              --title "TraditionalCafe $APP_VERSION_NAME" \
              --notes "Android update • versionCode: $APP_VERSION_CODE"
          fi
          gh release edit "$RELEASE_TAG" --latest

      - name: Release publishing status
        if: steps.publish_release.outcome != 'success'
        run: |
          echo "::warning::APK build succeeded, but GitHub Release publishing was blocked."
          echo "::warning::Repository Actions must allow write access, or add GH_RELEASE_TOKEN with Contents: write."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TraditionalCafe-signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 30
